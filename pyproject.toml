[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "wheel"]

[project]
name = "etrecord-adapter-model-explorer"
version = "0.1.0"
description = "ETRecord adapter package for Model Explorer"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["model-explorer", "executorch", "etrecord", "visualization"]
license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "ai-edge-model-explorer>=0.1.28,<0.2.0",
  "executorch>=1.2.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-timeout==2.4.0",
  "ruff==0.14.2",
  "pyright==1.1.407",
  "ai-edge-model-explorer==0.1.33",
]
coverage = [
  "pytest-cov==7.0.0",
]
build = [
  "build==1.3.0",
]

[tool.setuptools]
include-package-data = true

[tool.pyright]
include = [
  "src",
]
typeCheckingMode = "standard"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["etrecord_adapter_model_explorer*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [
  "src",
]
testpaths = [
  "src/etrecord_adapter_model_explorer/tests",
]

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [
  "build",
]

[tool.ruff.lint]
select = [
  "F",
  "B",
  "I",
  "SIM",
  "C4",
]

[tool.coverage.run]
omit = [
  "*/test_*",
  "*/config.py",
  "*/__init__.py",
]
