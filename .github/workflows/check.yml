name: Lint and Format

on:
  pull_request:
    branches: ["main"]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install qlty
        uses: qltysh/qlty-action/install@a19242102d17e497f437d7466aa01b528537e899 # v1.2.0
      - name: Check lint
        run: |
          qlty check
