name: Manual Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, SHA, or refs/pull/<number>/head to validate. Leave empty to use the selected workflow ref."
        required: false
        type: string
      build-wheel:
        description: "Build the wheel and upload it as a workflow artifact."
        required: true
        default: true
        type: boolean
      internal-dev-version:
        description: "Use a unique internal development version for the built wheel."
        required: true
        default: true
        type: boolean
      qlty-check:
        description: "Run Qlty checks."
        required: true
        default: true
        type: boolean
      qlty-check-all:
        description: "Run Qlty across the whole repository instead of only changed files."
        required: true
        default: true
        type: boolean
      publish-internal-pypi:
        description: "Publish the built wheel to internal PyPI/Artifactory. Only works from the internal repository."
        required: true
        default: false
        type: boolean

env:
  DEFAULT_PY_VERSION: "3.10"

jobs:
  qlty:
    name: Qlty checks
    if: ${{ inputs['qlty-check'] }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Qlty
        uses: qltysh/qlty-action/install@a2277a908db90c4c868832fb9204521fb940fdb4 # v1.2.0

      - name: Run Qlty
        run: |
          if [[ "${{ inputs['qlty-check-all'] }}" == "true" ]]; then
            qlty check --all
          else
            qlty check
          fi

  build-wheel:
    name: Build wheel
    if: ${{ inputs['build-wheel'] }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/build-wheel
        env:
          PIP_INDEX_URL: https://pypi.org/simple
        with:
          python-version: ${{ env.DEFAULT_PY_VERSION }}
          internal-dev-version: ${{ inputs['internal-dev-version'] }}

      - name: Create project SBOM output directory
        run: mkdir -p sbom

      - name: Generate project SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom/etrecord-adapter-model-explorer-source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Add SBOM disclaimer
        run: |
          python scripts/add-sbom-disclaimer.py \
            sbom/etrecord-adapter-model-explorer-source.spdx.json

      - name: Upload project SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: project-sbom
          path: sbom/*.spdx.json
          if-no-files-found: error

  publish-internal-pypi:
    name: Publish wheel to internal PyPI
    if: ${{ inputs['publish-internal-pypi'] && inputs['build-wheel'] && github.repository_owner != 'arm' }}
    needs:
      - build-wheel
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    environment:
      name: internal-pypi
    steps:
      - name: Require internal development version
        run: |
          if [[ "${{ inputs['internal-dev-version'] }}" != "true" ]]; then
            echo "Manual internal publishing requires internal-dev-version=true to avoid version collisions."
            exit 1
          fi

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish distribution to internal PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1.12.4
        with:
          repository-url: ${{ vars.INTERNAL_PYPI_UPLOAD_URL }}
          user: ${{ secrets.INTERNAL_PYPI_USERNAME }}
          password: ${{ secrets.INTERNAL_PYPI_TOKEN }}
          packages-dir: dist/
          attestations: false
